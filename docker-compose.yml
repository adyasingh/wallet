services:
  db:
    image: postgres
    container_name: db
    restart: always
    environment:
      POSTGRES_PASSWORD: postgres

  db-test:
    image: postgres
    container_name: db-test
    restart: always
    environment:
      POSTGRES_PASSWORD: postgres

  app:
    container_name: app
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - 8080:8080
    environment:
      TEST_DATABASE_URL: "host=db-test port=5432 user=postgres password=postgres dbname=postgres sslmode=disable"
      DATABASE_URL: "host=db port=5432 user=postgres password=postgres dbname=postgres sslmode=disable"
    depends_on:
      - db
      - db-test